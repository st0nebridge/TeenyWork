[package]
name = "compute-to-access-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
compute-to-access-core = { path = "../core" }
# No HTTP/2, compression, cookies or websockets: the API is HTTP/1.1 JSON on
# loopback, and h2 0.3 (actix's only HTTP/2 stack) has an unpatched advisory.
actix-web = { version = "4", default-features = false, features = ["macros", "unicode"] }
actix-rt = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
webpki-roots = "0.26"
subtle = "2.6"
